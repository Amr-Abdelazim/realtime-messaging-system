name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messaging
          POSTGRES_PASSWORD: messaging_dev
          POSTGRES_DB: messaging
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U messaging -d messaging"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://messaging:messaging_dev@localhost:5432/messaging
      DATABASE_URL_TEST: postgresql://messaging:messaging_dev@localhost:5432/chat_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      PORT: 3001
      LOG_LEVEL: fatal
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Create test databases
        run: |
          PGPASSWORD=messaging_dev psql -h localhost -U messaging -d messaging -c 'CREATE DATABASE chat_test;'
          PGPASSWORD=messaging_dev psql -h localhost -U messaging -d messaging -c 'CREATE DATABASE chat_worker_test;'
          PGPASSWORD=messaging_dev psql -h localhost -U messaging -d messaging -c 'CREATE DATABASE chat_t23_test;'

      - name: Apply migrations
        run: |
          pnpm db:deploy
          DATABASE_URL="$DATABASE_URL_TEST" pnpm db:deploy
          DATABASE_URL=postgresql://messaging:messaging_dev@localhost:5432/chat_worker_test pnpm db:deploy
          DATABASE_URL=postgresql://messaging:messaging_dev@localhost:5432/chat_t23_test pnpm db:deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
